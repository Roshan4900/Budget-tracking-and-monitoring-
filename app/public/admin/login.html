<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login — Sudurpaschim Budget</title>
  <style>
    :root { --navy:#1a3c5e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter','Segoe UI','Noto Sans Devanagari',system-ui,sans-serif; background:#f4f6f9; color:#16202c;
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .login { background:#fff; border:0.5px solid #e4e8ee; border-radius:12px; padding:28px 26px; width:100%; max-width:360px;
             box-shadow:0 8px 30px rgba(20,40,60,0.07); }
    .brand { font-size:13px; color:#8b94a1; margin-bottom:4px; }
    h1 { font-size:19px; font-weight:600; margin-bottom:18px; color:var(--navy); }
    label { display:block; font-size:12px; color:#4b5663; margin:12px 0 5px; }
    input { width:100%; padding:10px 12px; font-size:14px; border:1px solid #cfd6de; border-radius:7px; font-family:inherit; }
    input:focus { outline:2px solid var(--navy); outline-offset:1px; border-color:var(--navy); }
    button { width:100%; margin-top:18px; padding:11px; font-size:14px; font-weight:500; color:#fff; background:var(--navy);
             border:none; border-radius:7px; cursor:pointer; }
    button:hover { background:#15324f; }
    button:disabled { opacity:0.6; cursor:default; }
    .msg { margin-top:14px; font-size:12.5px; min-height:16px; }
    .msg.err { color:#c62828; }
    .back { display:block; text-align:center; margin-top:16px; font-size:12px; color:#4b5663; text-decoration:none; }
    .back:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <form class="login" id="loginForm">
    <div class="brand">सुदूरपश्चिम Budget · Admin</div>
    <h1>Sign in</h1>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="submitBtn">Log in</button>
    <div class="msg" id="msg"></div>
    <a class="back" href="/index.html">← Back to the public site</a>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'msg';
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg err';
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>

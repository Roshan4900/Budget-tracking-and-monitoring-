<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Outcome | Sudurpaschim Budget Visualizer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<header class="navbar">

    <a class="nav-brand" href="{{ url_for('home') }}">
        <span class="nav-title">सुदूरपश्चिम Budget</span>
        <span class="nav-sub">Sudurpaschim Province</span>
    </a>

</header>

<main class="container">

<div class="page-header">
    <h1>Edit Outcome</h1>
    <p>Update development outcome information.</p>
</div>

<div class="card">

<form method="POST">

<label><b>Indicator</b></label><br>
<input
type="text"
name="indicator"
value="{{ outcome.indicator }}"
required
style="width:100%; padding:10px;"><br><br>

<label><b>Province Value</b></label><br>
<input
type="number"
step="0.01"
name="province_value"
value="{{ outcome.province_value }}"
required
style="width:100%; padding:10px;"><br><br>

<label><b>National Value</b></label><br>
<input
type="number"
step="0.01"
name="national_value"
value="{{ outcome.national_value }}"
required
style="width:100%; padding:10px;"><br><br>

<label><b>Target Value</b></label><br>
<input
type="number"
step="0.01"
name="target_value"
value="{{ outcome.target_value }}"
required
style="width:100%; padding:10px;"><br><br>

<button class="nav-btn" type="submit">
Update Outcome
</button>

<a href="{{ url_for('outcomes') }}">
    <button class="nav-btn" type="button">
        Cancel
    </button>
</a>

</form>

</div>

</main>

</body>
</html>

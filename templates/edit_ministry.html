<!DOCTYPE html>
<html>
<head>
    <title>Edit Ministry</title>
</head>

<body>

<h1>Edit Ministry</h1>

<form method="POST">

<label>Ministry Name</label><br>
<input type="text" name="ministry_name"
value="{{ ministry.ministry_name }}" required><br><br>

<label>Nepali Name</label><br>
<input type="text" name="nepali_name"
value="{{ ministry.nepali_name }}"><br><br>

<label>Budget 2081</label><br>
<input type="number" step="0.01"
name="budget_2081"
value="{{ ministry.budget_2081 }}"><br><br>

<label>Budget 2080</label><br>
<input type="number" step="0.01"
name="budget_2080"
value="{{ ministry.budget_2080 }}"><br><br>

<label>Budget Share</label><br>
<input type="number" step="0.01"
name="budget_share"
value="{{ ministry.budget_share }}"><br><br>

<button type="submit">Update Ministry</button>

</form>

<br>

<a href="{{ url_for('ministries') }}">Back</a>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Ministry</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="container">

    <h1>Add Ministry</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>Ministry Name</label><br>
        <input type="text" name="ministry_name" required><br><br>

        <label>Nepali Name</label><br>
        <input type="text" name="nepali_name" required><br><br>
 
        <label>Budget 2081/82 (Cr)</label><br>
        <input type="number" step="0.01" name="budget_current" required><br><br>

        <label>Budget 2080/81 (Cr)</label><br>
        <input type="number" step="0.01" name="budget_previous" required><br><br>

        <label>Budget Share (%)</label><br>
        <input type="number" step="0.01" name="budget_share" required><br><br>

        <button type="submit">Save Ministry</button>

        <a href="{{ url_for('ministries') }}">
            <button type="button">Cancel</button>
        </a>

    </form>

</div>

</body>
</html>

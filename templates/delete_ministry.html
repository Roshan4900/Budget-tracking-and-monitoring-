<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delete Ministry | Sudurpaschim Budget Visualizer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<header class="navbar">
<a class="nav-brand" href="{{ url_for('home') }}">
<span class="nav-title">सुदूरपश्चिम Budget</span>
<span class="nav-sub">Sudurpaschim Province</span>
</a>
<nav class="nav-links">
<a class="nav-btn" href="{{ url_for('home') }}">Home</a>
<a class="nav-btn active" href="{{ url_for('ministries') }}">Ministries</a>
</nav>
</header>
<main class="container">
<div class="page-header">
<h1>Delete Ministry</h1>
<p>This action cannot be undone.</p>
</div>
<div class="card" style="max-width:500px;">
<p style="margin-bottom:20px; font-size:15px;">
    Are you sure you want to delete <strong>{{ ministry.ministry_name }}</strong> ({{ ministry.nepali_name }})?
</p>
<p style="margin-bottom:24px; font-size:13px; color:var(--color-text-secondary);">
    Budget 2081: Rs {{ ministry.budget_2081 }} Cr
</p>
<form method="POST">
<button type="submit" style="background:#c62828; color:white; padding:10px 20px; border:none; border-radius:6px; font-size:14px; cursor:pointer;">
        Yes, Delete Ministry
</button>
<a href="{{ url_for('ministries') }}" style="text-decoration:none;">
<button type="button" style="background:white; color:#1a3c5e; padding:10px 20px; border:1px solid #1a3c5e; border-radius:6px; font-size:14px; cursor:pointer; margin-left:10px;">
            Cancel
</button>
</a>
</form>
</div>
</main>
<footer class="footer">
    Sudurpaschim Province Budget Tracking System
</footer>
</body>
</html>
